<!DOCTYPE html>
<html>

<head>

    <title>Login - IT Help Desk</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <nav class="navbar">

        <div class="logo">
            🛠 IT HELP DESK
        </div>

        <div class="user">
            🔐 Login
        </div>

    </nav>


    <main class="login-container">

        <div class="login-card">

            <div class="login-icon">
                🛠️
            </div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Sign in to your IT Help Desk account
            </p>


            <form method="POST" action="/login">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit" class="login-btn">
                    🔐 Sign In
                </button>

            </form>

        </div>

    </main>

</body>

</html>

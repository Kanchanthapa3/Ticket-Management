
<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body class="login-page">

    <main class="login-container">

        <div class="login-card">

            <div class="login-logo">
                IT Help Desk
            </div>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="login-error">
                        {{ messages[0] }}
                    </div>
                {% endif %}
            {% endwith %}

            <form
                method="POST"
                action="/login"
                class="login-form"
            >

                <div class="login-field">
                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="login-field">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>

        </div>

    </main>

</body>

</html>
